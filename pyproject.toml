[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcore"
version = "0.1.0"
description = "Score the health of any repository from 0 to 100 and generate an SVG badge."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["repository", "health", "lint", "badge", "ci"]

[project.scripts]
reposcore = "reposcore:main"

[tool.setuptools]
py-modules = ["reposcore"]
