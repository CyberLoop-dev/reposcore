<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="reposcore: repository health score from 0 to 100">
  <title>reposcore</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14202b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .gauge { stroke-dasharray: 377; stroke-dashoffset: 377; animation: fill 2.2s cubic-bezier(.2,.7,.2,1) .3s forwards; }
    .pulse { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: beat 4s linear infinite; }
    .glow { animation: breathe 3s ease-in-out infinite; transform-origin: 150px 120px; }
    .num { opacity: 0; animation: pop .6s ease-out 1.6s forwards; }
    .fade { opacity: 0; animation: rise .7s ease-out forwards; }
    .c1 { animation-delay: .9s; } .c2 { animation-delay: 1.1s; } .c3 { animation-delay: 1.3s; }
    .c4 { animation-delay: 1.5s; } .c5 { animation-delay: 1.7s; }
    @keyframes fill { to { stroke-dashoffset: 30; } }
    @keyframes beat { 0% { stroke-dashoffset: 1500; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .6; transform: scale(1.08); } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="259" rx="17.5" fill="none" stroke="#30363d"/>

  <circle class="glow" cx="150" cy="120" r="78" fill="#3fb950"/>
  <circle cx="150" cy="120" r="60" fill="#0d1117" stroke="#30363d" stroke-width="12"/>
  <circle class="gauge" cx="150" cy="120" r="60" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 150 120)"/>
  <text class="sans num" x="150" y="132" text-anchor="middle" font-size="40" font-weight="700" fill="#e6edf3">92</text>
  <text class="sans num" x="150" y="152" text-anchor="middle" font-size="12" fill="#8b949e">/ 100</text>

  <text class="sans" x="260" y="108" font-size="56" font-weight="800" fill="url(#title)">reposcore</text>
  <text class="sans" x="262" y="144" font-size="20" fill="#8b949e">How healthy is your repo, really?</text>

  <g class="sans" font-size="13" font-weight="600">
    <g class="fade c1"><rect x="262" y="166" width="82" height="26" rx="13" fill="#1f2a37" stroke="#2d3b4b"/><text x="303" y="183" text-anchor="middle" fill="#7ee787">README</text></g>
    <g class="fade c2"><rect x="354" y="166" width="82" height="26" rx="13" fill="#1f2a37" stroke="#2d3b4b"/><text x="395" y="183" text-anchor="middle" fill="#7ee787">LICENSE</text></g>
    <g class="fade c3"><rect x="446" y="166" width="68" height="26" rx="13" fill="#1f2a37" stroke="#2d3b4b"/><text x="480" y="183" text-anchor="middle" fill="#7ee787">TESTS</text></g>
    <g class="fade c4"><rect x="524" y="166" width="50" height="26" rx="13" fill="#1f2a37" stroke="#2d3b4b"/><text x="549" y="183" text-anchor="middle" fill="#7ee787">CI</text></g>
    <g class="fade c5"><rect x="584" y="166" width="90" height="26" rx="13" fill="#1f2a37" stroke="#2d3b4b"/><text x="629" y="183" text-anchor="middle" fill="#7ee787">SECRETS</text></g>
  </g>

  <path class="pulse" d="M0 228 H260 L290 228 L306 200 L326 250 L346 214 L360 228 H900" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
</svg>
